[general]
pgp-provider=gpg
use-terminal-pinentry=true

[viewer]
pager=less --tilde -FRc

[filters]
text/plain=colorize
text/html=html | colorize
.headers=colorize
message/delivery-status=colorize

[ui]
threading-enabled=true
border-char-vertical=│
border-char-horizontal=─
styleset-name=evergarden-fall
